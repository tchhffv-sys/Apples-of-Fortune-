<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3L AREF PREDICTOR PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0f18; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 420px; background: #141824; border-radius: 20px; padding: 25px 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 212, 255, 0.2); border: 1px solid rgba(0, 212, 255, 0.1); }
        .login-card { text-align: center; display: flex; flex-direction: column; gap: 18px; }
        .icon-box { font-size: 50px; color: #00d4ff; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
        .login-card h2 { font-size: 22px; color: #e2e8f0; }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2d3748; background: #0f131d; color: #fff; text-align: center; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00d4ff; box-shadow: 0 0 8px rgba(0, 212, 255, 0.4); }
        .btn { padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #00d4ff, #7928ca); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .error-msg { color: #ff4d4d; font-size: 13px; display: none; }
        .hint-text { font-size: 11px; color: #64748b; line-height: 1.4; }
        
        .game-card { display: none; flex-direction: column; gap: 12px; }
        .user-status-bar { background: #0f131d; border: 1px solid #2d3748; border-radius: 12px; padding: 10px 15px; display: flex; flex-direction: column; gap: 5px; text-align: center; }
        .user-info-row { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; }
        .user-info-row span { color: #00d4ff; font-weight: bold; }
        .timer-display span { color: #f59e0b !important; }
        .status-text { font-size: 14px; color: #d8b4fe; font-weight: bold; min-height: 20px; }
        .grid-container { display: flex; gap: 10px; }
        .matrix { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .cell { aspect-ratio: 1; background: #1a202c; border: 2px solid #2d3748; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #00d4ff; transition: all 0.3s ease; }
        .cell.active { background: rgba(0, 212, 255, 0.15); border-color: #00d4ff; box-shadow: 0 0 12px rgba(0, 212, 255, 0.6); }
        .multipliers { display: flex; flex-direction: column; gap: 6px; width: 70px; }
        .mult-item { height: 100%; background: rgba(121, 40, 202, 0.2); border: 1px solid rgba(121, 40, 202, 0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #d8b4fe; }
        .controls { display: flex; gap: 10px; margin-top: 5px; }
        .controls .btn { flex: 1; }
        .btn-secondary { background: #2d3748; box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div class="login-card" id="loginCard">
        <div class="icon-box">🍎</div>
        <h2>3L AREF PREDICTOR</h2>
        <div class="input-group">
            <input type="text" id="userIdInput" placeholder="ادخل الـ ID (10 أرقام)" maxlength="10">
            <input type="password" id="passCode" placeholder="ادخل كود التفعيل">
        </div>
        <button class="btn" onclick="handleLogin()">دخول</button>
        <div class="error-msg" id="errorMsg">الـ ID خطأ أو الكود غير صحيح!</div>
        <div class="hint-text">أكوادك الخاصة دائمة، وباقي الأكواد تعمل حسب النظام المحدد.</div>
    </div>

    <!-- شاشة اللعبة -->
    <div class="game-card" id="gameCard">
        <div class="user-status-bar">
            <div class="user-info-row">
                <div>ID: <span id="displayId">0000000000</span></div>
                <div class="timer-display">الوقت المتبقي: <span id="timeLeft">--:--</span></div>
            </div>
            <div class="status-text" id="statusText">جاهز للبدء</div>
        </div>

        <div class="grid-container">
            <div class="matrix" id="matrix"></div>
            <div class="multipliers">
                <div class="mult-item">x27.97</div>
                <div class="mult-item">x11.18</div>
                <div class="mult-item">x6.71</div>
                <div class="mult-item">x4.02</div>
                <div class="mult-item">x2.41</div>
                <div class="mult-item">x1.93</div>
                <div class="mult-item">x1.54</div>
                <div class="mult-item">x1.23</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="startBtn" onclick="startPredictionFlow()">ابدأ</button>
            <button class="btn btn-secondary" onclick="resetGrid()">ابدأ من الأول</button>
        </div>
    </div>
</div>

<script>
    // الأكواد الدائمة الخاصة بك (لا تنتهي أبداً)
    const permanentCodes = [
        "AREF-MYCODE-1",
        "AREF-MYCODE-2",
        "AREF-MYCODE-3",
        "AREF-MYCODE-4",
        "AREF-MYCODE-5"
    ];

    // قاعدة بيانات الأكواد المؤقتة (15، 30، 60 دقيقة)
    const timedCodes = {
        15: [
            "AREF15-01", "AREF15-02", "AREF15-03", "AREF15-04", "AREF15-05",
            "AREF15-06", "AREF15-07", "AREF15-08", "AREF15-09", "AREF15-10"
        ],
        30: [
            "AREF30-01", "AREF30-02", "AREF30-03", "AREF30-04", "AREF30-05",
            "AREF30-06", "AREF30-07", "AREF30-08", "AREF30-09", "AREF30-10"
        ],
        60: [
            "AREF11", "AREF60-01", "AREF60-02", "AREF60-03", "AREF60-04", "AREF60-05"
        ]
    };

    const ROWS = 8;
    const COLS = 5;
    let timerInterval = null;

    function handleLogin() {
        const idInput = document.getElementById('userIdInput').value.trim();
        const codeInput = document.getElementById('passCode').value.trim().toUpperCase();
        const errorMsg = document.getElementById('errorMsg');

        // التحقق من الـ ID (10 أرقام)
        const isIdValid = /^\d{10}$/.test(idInput);
        if (!isIdValid) {
            errorMsg.innerText = 'يجب أن يتكون الـ ID من 10 أرقام صحيحة!';
            errorMsg.style.display = 'block';
            return;
        }

        // 1. فحص إذا كان الكود من أكوادك الدائمة الخاصة
        if (permanentCodes.includes(codeInput)) {
            errorMsg.style.display = 'none';
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('gameCard').style.display = 'flex';
            document.getElementById('displayId').innerText = idInput;
            
            createGrid();
            startSessionTimer(999999, true); 
            return;
        }

        // 2. فحص الأكواد المؤقتة
        let usedCodes = JSON.parse(localStorage.getItem('3l_aref_used_codes') || '[]');
        if (usedCodes.includes(codeInput)) {
            errorMsg.innerText = 'هذا الكود مستخدم من قبل ولا يمكن استخدامه مرة أخرى!';
            errorMsg.style.display = 'block';
            return;
        }

        let durationMinutes = 0;
        for (let minutes in timedCodes) {
            if (timedCodes[minutes].includes(codeInput)) {
                durationMinutes = parseInt(minutes);
                break;
            }
        }

        if (durationMinutes > 0) {
            usedCodes.push(codeInput);
            localStorage.setItem('3l_aref_used_codes', JSON.stringify(usedCodes));

            errorMsg.style.display = 'none';
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('gameCard').style.display = 'flex';
            document.getElementById('displayId').innerText = idInput;
            
            createGrid();
            startSessionTimer(durationMinutes * 60, false);
        } else {
            errorMsg.innerText = 'الكود غير صحيح أو منتهي الصلاحية!';
            errorMsg.style.display = 'block';
        }
    }

    function startSessionTimer(durationInSeconds, isPermanent) {
        const timeLeftDisplay = document.getElementById('timeLeft');
        if (isPermanent) {
            timeLeftDisplay.innerText = "دائم (VIP)";
            return;
        }

        let timer = durationInSeconds;
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            let minutes = Math.floor(timer / 60);
            let seconds = timer % 60;

            timeLeftDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (--timer < 0) {
                clearInterval(timerInterval);
                alert('انتهت صلاحية الكود المؤقت!');
                location.reload();
            }
        }, 1000);
    }

    function createGrid() {
        const matrix = document.getElementById('matrix');
        matrix.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                rowDiv.appendChild(cell);
            }
            matrix.appendChild(rowDiv);
        }
    }

    function resetGrid() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                if(cell) {
                    cell.classList.remove('active');
                    cell.innerText = '';
                }
            }
        }
        document.getElementById('statusText').innerText = 'جاهز للبدء';
    }

    function startPredictionFlow() {
        resetGrid();
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        startBtn.disabled = true;

        statusText.innerText = 'جاري الاتصال بالسيرفر...';
        setTimeout(() => {
            statusText.innerText = 'جاري سحب المعلومات...';
            setTimeout(() => {
                statusText.innerText = 'جاري تحليل الخوارزمية...';
                setTimeout(() => {
                    statusText.innerText = 'تم التوقع بنجاح!';
                    generatePrediction();
                    startBtn.disabled = false;
                }, 700);
            }, 800);
        }, 700);
    }

    function generatePrediction() {
        for (let r = ROWS - 1; r >= 0; r--) {
            const randomCol = Math.floor(Math.random() * COLS);
            const delay = (ROWS - 1 - r) * 120;
            
            setTimeout(() => {
                const cell = document.getElementById(`cell-${r}-${randomCol}`);
                if(cell) {
                    cell.classList.add('active');
                    cell.innerText = '🍎';
                }
            }, delay);
        }
    }
</script>

</body>
</html>
