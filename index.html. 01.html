<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMS MINES - SMART PREDICTOR 💎</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #080c14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(19, 28, 46, 0.95);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 12px 40px rgba(0, 210, 255, 0.15);
            border: 1px solid #1e2e4a;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .activation-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .activation-screen input {
            width: 100%;
            padding: 14px;
            background: #0d1524;
            border: 1px solid #233554;
            border-radius: 12px;
            color: #fff;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }

        .activation-screen input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .main-app {
            display: none;
        }

        h1 {
            font-size: 1.8rem;
            color: #00d2ff;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #7b8fae;
            margin-bottom: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #0d1524;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #182840;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .stat-item span {
            display: block;
            color: #00d2ff;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            background: #0b111e;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid #1a2a45;
        }

        .cell {
            aspect-ratio: 1;
            background: #142033;
            border: 2px solid #233554;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .cell.gem {
            background: rgba(0, 210, 255, 0.2);
            border-color: #00d2ff;
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.6);
            transform: scale(1.06);
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00d2ff, #005bb5);
            border: none;
            color: white;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
            transition: all 0.2s;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #00e676;
            min-height: 22px;
            font-weight: 600;
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.85rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>GEMS MINES 💎</h1>
        <p class="subtitle"></p>

        <!-- شاشة تسجيل الـ ID وكود التفعيل -->
        <div id="activationScreen" class="activation-screen">
            <p style="font-size: 0.9rem; color: #cbd5e1;">أدخل بيانات الحساب والتفعيل:</p>
            <input type="text" id="userIdInput" placeholder="أدخل ID الحساب الخاص بك">
            <input type="text" id="activationCodeInput" placeholder="أدخل كود التفعيل">
            <button class="btn-action" onclick="verifyCode()">تفعيل ودخول 🔑</button>
            <div id="activationError" class="error-msg"></div>
        </div>

        <!-- التطبيق الأساسي -->
        <div id="mainApp" class="main-app">
            <div class="stats-bar">
                <div class="stat-item">الـ ID المسجل<span id="displayUserId">---</span></div>
                <div class="stat-item">الجواهر<span id="gemsCountText">5 💎</span></div>
                <div class="stat-item">الوقت المتبقي<span id="timeRemaining">--:--</span></div>
            </div>

            <div class="grid" id="grid"></div>

            <button class="btn-action" onclick="generateSmartPrediction()">توليد مسار جديد (5 توقعات) 🎯</button>
            <div class="status" id="statusText">جاهز لتوليد التوقع</div>
        </div>
    </div>

    <script>
        // 🔑 قاعدة بيانات الأكواد ومدد التفعيل بالدقائق (0 يعني دائم)
        const CODES_DATABASE = {
            // أكواد دائمة (VIP)
            "AREF-MYCODE-1": 0, "AREF-MYCODE-2": 0, "AREF-MYCODE-3": 0, "AREF-MYCODE-4": 0, "AREF-MYCODE-5": 0,

            // أكواد 15 دقيقة
            "AREF15-01": 15, "AREF15-02": 15, "AREF15-03": 15, "AREF15-04": 15, "AREF15-05": 15,
            "AREF15-06": 15, "AREF15-07": 15, "AREF15-08": 15, "AREF15-09": 15, "AREF15-10": 15,

            // أكواد 30 دقيقة
            "AREF30-01": 30, "AREF30-02": 30, "AREF30-03": 30, "AREF30-04": 30, "AREF30-05": 30,
            "AREF30-06": 30, "AREF30-07": 30, "AREF30-08": 30, "AREF30-09": 30, "AREF30-10": 30,

            // أكواد 60 دقيقة
            "AREF11": 60, "AREF60-01": 60, "AREF60-02": 60, "AREF60-03": 60, "AREF60-04": 60, "AREF60-05": 60
        };

        const GRID_SIZE = 25;
        const GEMS_PER_ROUND = 5; // تم تحديد 5 أماكن فقط لكل جولة
        let roundCount = 0;
        let history = [];
        let timerInterval = null;

        window.onload = function() {
            checkExistingSession();
        };

        function checkExistingSession() {
            const expiryTime = localStorage.getItem('app_expiry_time');
            const savedUserId = localStorage.getItem('app_user_id');

            if (expiryTime && savedUserId) {
                if (expiryTime === 'VIP') {
                    showMainApp(savedUserId, "دائم VIP");
                } else {
                    const now = Date.now();
                    if (now < parseInt(expiryTime)) {
                        showMainApp(savedUserId);
                        startCountdown(parseInt(expiryTime));
                    } else {
                        localStorage.removeItem('app_expiry_time');
                        localStorage.removeItem('app_user_id');
                        showActivationScreen("⚠️ انتهت مدة صلاحية الكود!");
                    }
                }
            }
        }

        function verifyCode() {
            const userId = document.getElementById('userIdInput').value.trim();
            const inputCode = document.getElementById('activationCodeInput').value.trim();
            const errorDiv = document.getElementById('activationError');

            if (!userId) {
                errorDiv.innerText = "❌ يرجى أدخال ID الحساب أولاً!";
                return;
            }

            if (CODES_DATABASE.hasOwnProperty(inputCode)) {
                const durationMinutes = CODES_DATABASE[inputCode];
                localStorage.setItem('app_user_id', userId);

                if (durationMinutes === 0) {
                    localStorage.setItem('app_expiry_time', 'VIP');
                    showMainApp(userId, "دائم VIP");
                } else {
                    const expiryTime = Date.now() + (durationMinutes * 60 * 1000);
                    localStorage.setItem('app_expiry_time', expiryTime.toString());
                    showMainApp(userId);
                    startCountdown(expiryTime);
                }
            } else {
                errorDiv.innerText = "❌ كود التفعيل غير صحيح!";
            }
        }

        function showMainApp(userId, vipText = null) {
            document.getElementById('activationScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayUserId').innerText = userId;
            
            if (vipText) {
                document.getElementById('timeRemaining').innerText = vipText;
            }
            initGrid();
        }

        function showActivationScreen(msg = "") {
            document.getElementById('activationScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('activationError').innerText = msg;
        }

        function startCountdown(expiryTimestamp) {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const now = Date.now();
                const diff = expiryTimestamp - now;

                if (diff <= 0) {
                    clearInterval(timerInterval);
                    localStorage.removeItem('app_expiry_time');
                    localStorage.removeItem('app_user_id');
                    showActivationScreen("⚠️ انتهت المدة المحددة للسكربت!");
                } else {
                    const minutes = Math.floor(diff / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    document.getElementById('timeRemaining').innerText = 
                        `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let i = 0; i < GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                grid.appendChild(cell);
            }
        }

        function getUniquePattern() {
            let attempts = 0;
            let newPattern = [];

            while (attempts < 100) {
                newPattern = [];
                while (newPattern.length < GEMS_PER_ROUND) {
                    const rand = Math.floor(Math.random() * GRID_SIZE);
                    if (!newPattern.includes(rand)) newPattern.push(rand);
                }

                if (history.length === 0) break;
                const lastPattern = history[history.length - 1];
                const overlap = newPattern.filter(pos => lastPattern.includes(pos)).length;

                if (overlap <= 2) break; // تنوع في اختيار الـ 5 أماكن
                attempts++;
            }

            history.push(newPattern);
            if (history.length > 10) history.shift();

            return newPattern;
        }

        function generateSmartPrediction() {
            roundCount++;
            const status = document.getElementById('statusText');
            
            status.style.color = '#00d2ff';
            status.innerText = "جاري مسح الخريطة واستخراج 5 أماكن...";

            for (let i = 0; i < GRID_SIZE; i++) {
                const cell = document.getElementById(`cell-${i}`);
                cell.className = 'cell';
                cell.innerText = '';
            }

            const selectedPattern = getUniquePattern();

            selectedPattern.forEach((index, i) => {
                setTimeout(() => {
                    const cell = document.getElementById(`cell-${index}`);
                    cell.classList.add('gem');
                    cell.innerText = '💎';

                    if (i === selectedPattern.length - 1) {
                        status.style.color = '#00e676';
                        status.innerText = "✨ تم حديد 5 أماكن آمنة بنجاح!";
                    }
                }, (i + 1) * 150);
            });
        }
    </script>
</body>
</html>
